name: Publish game feedback issues

on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:

permissions: {}
concurrency:
  group: game-feedback-relay
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'guylfe/waystone' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Publish playtest issues from this runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/game-feedback-publisher.mjs
